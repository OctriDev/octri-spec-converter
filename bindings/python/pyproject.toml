[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octri-spec-converter"
version = "0.1.3"
description = "Python bindings for the offline Octri Rust Spec Converter"
readme = "README.md"
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE", "OAI-LICENSE", "THIRD-PARTY-NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octri_converter = ["native/*"]

[project.urls]
Repository = "https://github.com/octridev/octri-spec-converter"
Issues = "https://github.com/octridev/octri-spec-converter/issues"
