[package]
name = "octri-converter"
description = "Offline API description conversion with source provenance and reviewed fidelity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
url.workspace = true
octri-parser.workspace = true
octri-auditor.workspace = true
base64 = "0.22"
graphql-parser = "0.4.1"
protox = "0.10"
prost-reflect = { version = "0.16.5", features = ["serde"] }
quick-xml = "0.42"
percent-encoding = "2.3"
heck = "0.5"
Inflector = "0.11.4"
jsonschema = { version = "0.58.6", default-features = false, features = ["arbitrary-precision"] }

[lints]
workspace = true

